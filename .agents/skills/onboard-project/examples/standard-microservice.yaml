# yaml-language-server: $schema=../../../../schemas/domain-repos.schema.json
# =============================================================================
# Example Domain Repository Configuration (`config/orgs/<org>/repos/<domain>.yaml`)
# =============================================================================

domain:
  key: "example-domain"
  name: "Example Engineering Domain"
  description: "Reference domain file demonstrating shared defaults and concise per-repository definitions."
  organization: "taswater-core"

defaults:
  archetype: "standard-microservice"
  topics:
    - "example-domain"
    - "taswater-core"
  team_access:
    - team: "platform-developers"
      permission: "push"
    - team: "platform-maintainers"
      permission: "maintain"
    - team: "security-auditors"
      permission: "pull"
  environments:
    - name: "dev"
      description: "Development integration environment"
      require_approval: false
    - name: "staging"
      description: "Staging verification environment"
      require_approval: false
    - name: "prod"
      description: "Production environment"
      require_approval: true
      approver_teams:
        - "platform-maintainers"

repositories:
  - name: "example-domain-api"
    description: "Primary REST API for the Example Engineering Domain."
    required_status_checks:
      - "ci / build-and-test"
    codeowners_teams:
      - path: "/infra/*"
        teams:
          - "platform-maintainers"

  - name: "example-domain-worker"
    description: "Asynchronous background worker for the Example Engineering Domain."
