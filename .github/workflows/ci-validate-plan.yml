name: "GitHub IaC Validate & OpenTofu Plan"

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "feature/*", "hotfix/*"]

# Least-privilege default token permissions for public repository safety
permissions:
  contents: read

jobs:
  validate-guardrails:
    name: "1. Schema, Policy & AI Guardrails Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.2"

      - name: Run Unified Validation Harness
        run: ./scripts/validate.sh

  opentofu-plan:
    name: "2. OpenTofu Plan (taswater GitHub Org)"
    needs: validate-guardrails
    runs-on: ubuntu-latest
    # Only run plan when enabled and never expose the app key to external forks.
    if: >-
      vars.TOFU_PLAN_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    defaults:
      run:
        working-directory: environments/taswater
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create GitHub App installation token
        id: github-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: TasWater

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.2"

      - name: OpenTofu Init
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: tofu init

      - name: OpenTofu Validate
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: tofu validate

      - name: OpenTofu Plan Organisation
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: |
          set -o pipefail
          tofu plan -input=false -no-color -out="$RUNNER_TEMP/tofu-plan.tfplan" 2>&1 | tee "$RUNNER_TEMP/tofu-plan.txt"
          tofu show -json "$RUNNER_TEMP/tofu-plan.tfplan" > "$RUNNER_TEMP/tofu-plan.json"

      - name: Add plan summary to job summary
        if: always()
        run: |
          {
            echo "<details>"
            echo "<summary>OpenTofu plan summary</summary>"
            echo
            echo '```text'
            if [ -f "$RUNNER_TEMP/tofu-plan.txt" ]; then
              plan_summary="$(grep '^Plan: ' "$RUNNER_TEMP/tofu-plan.txt" | tail -n 1 || true)"
              if [ -n "$plan_summary" ]; then
                echo "$plan_summary"
              else
                echo "No plan summary was captured."
              fi
            else
              echo "No plan summary was captured."
            fi
            echo '```'
            if [ -f "$RUNNER_TEMP/tofu-plan.json" ] && jq -e '(.output_changes // {}) | length > 0' "$RUNNER_TEMP/tofu-plan.json" >/dev/null; then
              echo
              echo "Changes to Outputs:"
              echo '```json'
              jq '
                def has_sensitive:
                  if . == true then true
                  elif type == "object" then any(.[]; has_sensitive)
                  elif type == "array" then any(.[]; has_sensitive)
                  else false
                  end;
                (.output_changes // {})
                | with_entries(
                    .value |= (
                      if ((.before_sensitive // false) | has_sensitive)
                      then .before = "(sensitive)"
                      else .
                      end
                      | if ((.after_sensitive // false) | has_sensitive)
                        then .after = "(sensitive)"
                        else .
                        end
                      | del(.before_sensitive, .after_sensitive)
                    )
                  )
              ' "$RUNNER_TEMP/tofu-plan.json"
              echo '```'
            fi
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  opentofu-plan-enterprise:
    name: "2. OpenTofu Plan (taswater GitHub Enterprise)"
    needs: validate-guardrails
    runs-on: ubuntu-latest
    # Only run plan when enabled and never expose the app key to external forks.
    if: >-
      vars.TOFU_PLAN_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    defaults:
      run:
        working-directory: environments/enterprise
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create GitHub App installation token
        id: github-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: TasWater

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.2"

      - name: OpenTofu Init
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: tofu init

      - name: OpenTofu Validate
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: tofu validate

      - name: OpenTofu Plan Enterprise
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: |
          set -o pipefail
          tofu plan -input=false -no-color -out="$RUNNER_TEMP/tofu-plan.tfplan" 2>&1 | tee "$RUNNER_TEMP/tofu-plan.txt"
          tofu show -json "$RUNNER_TEMP/tofu-plan.tfplan" > "$RUNNER_TEMP/tofu-plan.json"

      - name: Add plan summary to job summary
        if: always()
        run: |
          {
            echo "<details>"
            echo "<summary>OpenTofu plan summary</summary>"
            echo
            echo '```text'
            if [ -f "$RUNNER_TEMP/tofu-plan.txt" ]; then
              plan_summary="$(grep '^Plan: ' "$RUNNER_TEMP/tofu-plan.txt" | tail -n 1 || true)"
              if [ -n "$plan_summary" ]; then
                echo "$plan_summary"
              else
                echo "No plan summary was captured."
              fi
            else
              echo "No plan summary was captured."
            fi
            echo '```'
            if [ -f "$RUNNER_TEMP/tofu-plan.json" ] && jq -e '(.output_changes // {}) | length > 0' "$RUNNER_TEMP/tofu-plan.json" >/dev/null; then
              echo
              echo "Changes to Outputs:"
              echo '```json'
              jq '
                def has_sensitive:
                  if . == true then true
                  elif type == "object" then any(.[]; has_sensitive)
                  elif type == "array" then any(.[]; has_sensitive)
                  else false
                  end;
                (.output_changes // {})
                | with_entries(
                    .value |= (
                      if ((.before_sensitive // false) | has_sensitive)
                      then .before = "(sensitive)"
                      else .
                      end
                      | if ((.after_sensitive // false) | has_sensitive)
                        then .after = "(sensitive)"
                        else .
                        end
                      | del(.before_sensitive, .after_sensitive)
                    )
                  )
              ' "$RUNNER_TEMP/tofu-plan.json"
              echo '```'
            fi
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
