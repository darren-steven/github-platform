name: "GitHub IaC Validate & OpenTofu Plan"

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "feature/*", "hotfix/*"]

# Least-privilege default token permissions for public repository safety
permissions:
  contents: read

jobs:
  validate-guardrails:
    name: "1. Schema, Policy & AI Guardrails Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.2"

      - name: Run Unified Validation Harness
        run: ./scripts/validate.sh

  opentofu-plan:
    name: "2. OpenTofu Plan (taswater GitHub Org)"
    needs: validate-guardrails
    runs-on: ubuntu-latest
    # Only run plan when enabled and never expose the app key to external forks.
    if: >-
      vars.TOFU_PLAN_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    defaults:
      run:
        working-directory: environments/taswater
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dump Env
        run: env

      - name: Create GitHub App installation token
        id: github-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: TasWater

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.2"

      - name: OpenTofu Init
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: tofu init

      - name: OpenTofu Validate
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: tofu validate

      - name: OpenTofu Plan Organisation
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: tofu plan -input=false -no-color

  opentofu-plan-enterprise:
    name: "2. OpenTofu Plan (taswater GitHub Enterprise)"
    needs: validate-guardrails
    runs-on: ubuntu-latest
    # Only run plan when enabled and never expose the app key to external forks.
    if: >-
      vars.TOFU_PLAN_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    defaults:
      run:
        working-directory: environments/enterprise
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dump Env
        run: env

      - name: Create GitHub App installation token
        id: github-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: TasWater

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.2"

      - name: OpenTofu Init
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: tofu init

      - name: OpenTofu Validate
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: tofu validate

      - name: OpenTofu Plan Organisation
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: tofu plan -input=false -no-color
