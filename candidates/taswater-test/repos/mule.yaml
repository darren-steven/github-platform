# yaml-language-server: $schema=../../../../schemas/domain-repos.schema.json
domain:
  key: mule
  name: Mule Domain
  description: Repositories aligned to the Mule domain in taswater.
  organization: taswater
defaults:
  archetype: standard-microservice
  topics:
  - mule
  - taswater
  team_access:
  - team: h2go
    permission: pull
  environments:
  - name: dev
    description: Development environment
    require_approval: false
  - name: staging
    description: Staging environment
    require_approval: false
  - name: prod
    description: Production environment
    require_approval: true
    approver_teams:
    - bsa
repositories:
- name: mule-nonprod-config
  description: Project for environment config properties
- name: mule-prod-config
  description: Properties for Prod deployment
