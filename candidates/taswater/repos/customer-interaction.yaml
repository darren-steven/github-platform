# yaml-language-server: $schema=../../../../schemas/domain-repos.schema.json
domain:
  key: customer-interaction
  name: Customer Interaction Domain
  description: Repositories aligned to the Customer Interaction domain in taswater.
  organization: taswater
defaults:
  archetype: shared-library
  topics:
  - customer-interaction
  - taswater
  team_access:
  - team: bsa
    permission: maintain
  environments:
  - name: dev
    description: Development environment
    require_approval: false
  - name: staging
    description: Staging environment
    require_approval: false
  - name: prod
    description: Production environment
    require_approval: true
    approver_teams:
    - bsa
repositories:
- name: customer-interaction-eapi-v1
  description: Repository customer-interaction-eapi-v1
- name: customer-interaction-papi-v1
  description: Repository customer-interaction-papi-v1
