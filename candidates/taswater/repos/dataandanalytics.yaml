# yaml-language-server: $schema=../../../../schemas/domain-repos.schema.json
domain:
  key: dataandanalytics
  name: Dataandanalytics Domain
  description: Repositories aligned to the Dataandanalytics domain in taswater.
  organization: taswater
defaults:
  archetype: standard-microservice
  topics:
  - dataandanalytics
  - taswater
  team_access:
  - team: dataandanalytics
    permission: maintain
  - team: reporting
    permission: push
  environments:
  - name: dev
    description: Development environment
    require_approval: false
  - name: staging
    description: Staging environment
    require_approval: false
  - name: prod
    description: Production environment
    require_approval: true
    approver_teams:
    - dataandanalytics
repositories:
- name: reporting
  description: Repository for version control of enterprise report objects
