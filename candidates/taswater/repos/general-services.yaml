# yaml-language-server: $schema=../../../../schemas/domain-repos.schema.json
domain:
  key: general-services
  name: General Services Domain
  description: Repositories aligned to the General Services domain in taswater.
  organization: taswater
defaults:
  archetype: shared-library
  topics:
  - general-services
  - taswater
  team_access:
  - team: bsa
    permission: maintain
  environments:
  - name: dev
    description: Development environment
    require_approval: false
  - name: staging
    description: Staging environment
    require_approval: false
  - name: prod
    description: Production environment
    require_approval: true
    approver_teams:
    - bsa
repositories:
- name: .github
  description: Repository .github
- name: 761_anywhere_development
  description: Anywhere repo used for 7.6.1 release
  archetype: standard-microservice
- name: 762_anywhere_development
  description: Anywhere 762 Upgraded Source for TasWater
  archetype: standard-microservice
- name: anypoint-wrapper-cli
  description: Wrapper for Mulesoft API
  archetype: standard-microservice
  team_access:
  - team: h2go
    permission: pull
- name: Anywhere761full
