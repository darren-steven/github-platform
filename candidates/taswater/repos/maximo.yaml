# yaml-language-server: $schema=../../../../schemas/domain-repos.schema.json
domain:
  key: maximo
  name: Maximo Domain
  description: Repositories aligned to the Maximo domain in taswater.
  organization: taswater
defaults:
  archetype: standard-microservice
  topics:
  - maximo
  - taswater
  team_access:
  - team: maximo
    permission: push
  environments:
  - name: dev
    description: Development environment
    require_approval: false
  - name: staging
    description: Staging environment
    require_approval: false
  - name: prod
    description: Production environment
    require_approval: true
    approver_teams:
    - maximo
repositories:
- name: anywhere_development
  description: Repository anywhere_development
- name: turbine_deployment
  description: Turbine repository for environment deployments
- name: turbine_development
  description: Turbine Project Development Repository
