# yaml-language-server: $schema=../../../../schemas/domain-repos.schema.json
domain:
  key: scada
  name: Scada Domain
  description: Repositories aligned to the Scada domain in taswater.
  organization: taswater
defaults:
  archetype: shared-library
  topics:
  - scada
  - taswater
  team_access:
  - team: scada
    permission: push
  environments:
  - name: dev
    description: Development environment
    require_approval: false
  - name: staging
    description: Staging environment
    require_approval: false
  - name: prod
    description: Production environment
    require_approval: true
    approver_teams:
    - scada
repositories:
- name: test
  description: Repository test
