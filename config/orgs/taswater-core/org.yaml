# yaml-language-server: $schema=../../../schemas/org.schema.json
# =============================================================================
# GitHub Organization Policy Dials: taswater-core (Tier 2)
# =============================================================================
# Maintainers: Edit the values below within the documented bounds.
# Note: Tier 1 Immutable Baselines (no public repositories, SAML SSO, read-only
# default GITHUB_TOKEN, and mandatory PR review gates) are enforced by schema
# and policy and cannot be weakened here.
# =============================================================================

organization:
  slug: "taswater-core"
  name: "TasWater Core Engineering"
  description: "Core platform infrastructure, data integration, and operational technology repositories."
  billing_email: "cloud-platform@taswater.com.au"
  default_archetype: "standard-microservice"

# -----------------------------------------------------------------------------
# Security & Member Privilege Dials (Organization-wide)
# -----------------------------------------------------------------------------
security_dials:
  members_can_create_private_repositories: false
  members_can_create_internal_repositories: false
  members_can_fork_private_repositories: false
  web_commit_signoff_required: false
  dependabot_alerts_enabled_for_new_repositories: true
  secret_scanning_enabled_for_new_repositories: true
  secret_scanning_push_protection_enabled_for_new_repositories: true

# -----------------------------------------------------------------------------
# GitHub Actions Governance Dials
# -----------------------------------------------------------------------------
actions_dials:
  allowed_actions: "selected"
  allow_github_owned_actions: true
  allow_verified_creator_actions: true
  default_workflow_permissions: "read"
  can_approve_pull_request_reviews: false
  sha_pinning_required: true
  default_job_timeout_minutes: 60

# -----------------------------------------------------------------------------
# Default Repository & Branch Protection Dials
# -----------------------------------------------------------------------------
repository_defaults:
  default_branch: "main"
  min_reviewers: 2
  dismiss_stale_reviews: true
  require_code_owner_reviews: true
  require_last_push_approval: true
  require_conversation_resolution: true
  allowed_merge_types:
    squash: true
    merge_commit: true
    rebase: false
    auto_merge: true
    delete_branch_on_merge: true

# -----------------------------------------------------------------------------
# Organization-Level Actions Runner Groups
# -----------------------------------------------------------------------------
runner_groups:
  - name: "taswater-linux-runners"
    visibility: "selected"
    allow_public_repositories: false
  - name: "taswater-regulated-runners"
    visibility: "selected"
    allow_public_repositories: false
