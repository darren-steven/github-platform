# yaml-language-server: $schema=../../../../schemas/domain-repos.schema.json
# =============================================================================
# Domain Repositories: Core Platform Services (`taswater-core`)
# =============================================================================
# Groups related platform repositories under shared domain defaults. Individual
# repositories inherit `defaults` and their archetype baseline unless overridden.
# =============================================================================

domain:
  key: "platform-services"
  name: "Core Platform Services"
  description: "Shared platform microservices, identity brokers, and internal engineering SDKs."
  organization: "taswater-core"

defaults:
  archetype: "standard-microservice"
  topics:
    - "platform"
    - "taswater-core"
  team_access:
    - team: "platform-developers"
      permission: "push"
    - team: "platform-maintainers"
      permission: "maintain"
    - team: "security-auditors"
      permission: "pull"
  environments:
    - name: "dev"
      description: "Development integration environment"
      require_approval: false
    - name: "staging"
      description: "Pre-production verification environment"
      require_approval: false
    - name: "prod"
      description: "Production environment"
      require_approval: true
      approver_teams:
        - "platform-maintainers"

repositories:
  - name: "example-service-api"
    description: "Core REST API for the Example Platform Service."
    required_status_checks:
      - "ci / build-and-test"
      - "security / codeql"
    codeowners_teams:
      - path: "/infra/*"
        teams:
          - "platform-maintainers"
      - path: "/.github/workflows/*"
        teams:
          - "platform-admins"
    environment_variables:
      SERVICE_REGION: "australiaeast"
      LOG_LEVEL: "Information"

  - name: "example-service-worker"
    description: "Background queue processor for the Example Platform Service."

  - name: "identity-token-broker"
    description: "Regulated OIDC token exchange and workload identity federation broker."
    archetype: "regulated-workload"
    branch_protection:
      min_reviewers: 3
      require_signed_commits: true
    codeowners_teams:
      - path: "/*"
        teams:
          - "platform-admins"
          - "platform-maintainers"

  - name: "platform-observability-sdk"
    description: "Inner-source OpenTelemetry logging and tracing SDK shared across enterprise orgs."
    archetype: "shared-library"
