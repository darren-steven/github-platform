# yaml-language-server: $schema=../../../../schemas/domain-repos.schema.json
domain:
  key: gentrack
  name: Gentrack Domain
  description: Repositories aligned to the Gentrack domain in taswater.
  organization: taswater
defaults:
  archetype: standard-microservice
  topics:
  - gentrack
  - taswater
  team_access:
  - team: gentrack
    permission: push
  environments:
  - name: dev
    description: Development environment
    require_approval: false
  - name: staging
    description: Staging environment
    require_approval: false
  - name: prod
    description: Production environment
    require_approval: true
    approver_teams:
    - gentrack
repositories:
- name: ARG1903_Equalisation
  description: Repository ARG1903_Equalisation
- name: BillFileRecognition
  description: Repository BillFileRecognition
  team_access:
  - team: gentrack
    permission: push
  - team: reporting
    permission: push
- name: CentrePay_Receipt_ETL
  description: SSIS Package for CentrePay_Receipt_ETL
- name: Gentrack-ABCorp-Integration
  description: Repository for all ABCorp integration related code
  archetype: shared-library
  team_access:
  - team: gentrack
    permission: maintain
- name: Gentrack-Pricing-Snapshot-system---DW
  description: TasWater in-house system to take point-in-time pricing snapshots and
    store in DW.  Both Service and Usage pricing types.
  archetype: shared-library
  team_access:
  - team: bsa
    permission: maintain
- name: Gentrack-RFGateways-Integration
  description: Repository Gentrack-RFGateways-Integration
  archetype: shared-library
  team_access:
  - team: bsa
    permission: maintain
- name: gentrack-sapi-v1
  description: Repository gentrack-sapi-v1
  archetype: shared-library
  team_access:
  - team: bsa
    permission: maintain
- name: Gentrack-SSIS
  description: Gentrack SSIS packages
  team_access:
  - team: gentrack
    permission: push
  - team: sql
    permission: pull
- name: OGP-DatabaseMigration
  description: One Gentrack Project Database Migration
- name: PSP3
  description: PSP3 SQL objects,  Calculators
- name: SSIS_CreditCycles
  description: Repository SSIS_CreditCycles
- name: SSIS_GTLetterImport
  description: Import of Gentrack letters generated by external Print House
  archetype: shared-library
- name: SSIS_VisTas
  description: SSIS Packages for Vistas COO and Other COO Packages
  archetype: shared-library
- name: SSRS_GT_IntegrityCheck
  description: Gentrack SSRS Integrity reports.
  archetype: shared-library
  team_access:
  - team: gentrack
    permission: maintain
- name: WestPac_FileSplitter_Reports
  description: SSRS packages for Westpac file splitters
- name: Westpac_FileSplitters
  description: SSIS Westpac_FileSplitters packages
