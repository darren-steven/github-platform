# yaml-language-server: $schema=../../../../schemas/domain-repos.schema.json
domain:
  key: ogp
  name: Ogp Domain
  description: Repositories aligned to the Ogp domain in taswater.
  organization: taswater
defaults:
  archetype: shared-library
  topics:
  - ogp
  - taswater
  team_access:
  - team: bsa
    permission: maintain
  environments:
  - name: dev
    description: Development environment
    require_approval: false
  - name: staging
    description: Staging environment
    require_approval: false
  - name: prod
    description: Production environment
    require_approval: true
    approver_teams:
    - bsa
repositories:
- name: OGP-IntegrationAndReporting
  description: scripts for Integration & Reporting system updates for One Gentrack
    Project
