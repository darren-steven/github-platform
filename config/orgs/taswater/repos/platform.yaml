# yaml-language-server: $schema=../../../../schemas/domain-repos.schema.json
domain:
  key: platform
  name: Platform Domain
  description: Repositories aligned to the Platform domain in taswater.
  organization: taswater
defaults:
  archetype: shared-library
  topics:
  - platform
  - taswater
  team_access:
  - team: bsa
    permission: maintain
  environments:
  - name: dev
    description: Development environment
    require_approval: false
  - name: staging
    description: Staging environment
    require_approval: false
  - name: prod
    description: Production environment
    require_approval: true
    approver_teams:
    - bsa
repositories:
- name: platform-azuredevops
  description: AzureDevops IaC
- name: platform-github
  description: GitGub IaC
  jira_autolink:
    project_key: PLATFORM
